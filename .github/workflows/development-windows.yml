name: Development Windows

on:
  push:
    branches: [cloud-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # GPUI's debug renderer loads HLSL from absolute build-machine paths. Both
  # the library and its build script must select the embedded-bytecode branch.
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "false"
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG_ASSERTIONS: "false"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "false"
  CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG_ASSERTIONS: "false"
  VIBEX_REVIEW_TEST_TARGET: ${{ github.workspace }}/target/review-tests
  VIBEX_CHANNEL: preview
  VIBEX_INSTALL_PACKAGE: unmanaged
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  CARGO_TERM_COLOR: always

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.3.0
      - name: Prepare native toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (-not $toolchain) { throw 'Missing pinned Rust toolchain' }
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw 'Visual Studio C++ x64 tools are missing' }
          $devShell = Join-Path $vsRoot 'Common7\Tools\Launch-VsDevShell.ps1'
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($key in @('Path', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir', 'WindowsSdkDir')) {
            $value = [Environment]::GetEnvironmentVariable($key, 'Process')
            if ($value) { "$key=$value" >> $env:GITHUB_ENV }
          }
          $fxc = (Get-Command fxc.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $fxc) {
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $fxc = Get-ChildItem -LiteralPath $sdkBin -Directory |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'x64\fxc.exe' } |
              Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $fxc) { throw 'Windows SDK FXC compiler is required for portable GPUI shaders' }
          "GPUI_FXC_PATH=$fxc" >> $env:GITHUB_ENV
          Write-Output "GPUI shader compiler: $fxc"
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
            $nasmDir = Join-Path $env:ProgramFiles 'NASM'
            if (-not (Test-Path (Join-Path $nasmDir 'nasm.exe'))) { throw 'NASM executable is missing' }
            $nasmDir >> $env:GITHUB_PATH
          }
          rustc --version
          cargo --version
      - name: Restore Rust dependency and build caches
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          prefix-key: review-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.github/workflows/development-windows.yml', 'scripts/run-model-review-tests.mjs') }}
          shared-key: windows-2022-preview
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST VIBEX GPUI_FXC_PATH
          workspaces: |
            . -> target/preview
            . -> target/review-tests
          cache-bin: "false"
          cache-on-failure: "true"
      - name: Install locked source assets and check scripts
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          pnpm check:frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend checks failed' }
          node --check scripts/package-development-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packager syntax check failed' }
          node scripts/check-development-windows-shaders.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable shader gate regression checks failed' }
          node --test scripts/run-model-review-tests.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Model review test runner self-tests failed' }
          cargo metadata --locked --no-deps --format-version 1 > "$env:RUNNER_TEMP\vibex-metadata.json"
          if ($LASTEXITCODE -ne 0) { throw 'Locked workspace metadata failed' }
      - name: Compile Git review tests
        timeout-minutes: 15
        run: node scripts/run-model-review-tests.mjs --suite git --phase compile
      - name: Test Git selection and snapshots
        timeout-minutes: 5
        run: node scripts/run-model-review-tests.mjs --suite git --phase test
      - name: Compile model client tests
        timeout-minutes: 15
        run: node scripts/run-model-review-tests.mjs --suite config --phase compile
      - name: Test model parsing and timeouts
        timeout-minutes: 5
        run: node scripts/run-model-review-tests.mjs --suite config --phase test
      - name: Compile isolated credential test
        timeout-minutes: 10
        run: node scripts/run-model-review-tests.mjs --suite credentials --phase compile
      - name: Test HostFile credentials
        timeout-minutes: 5
        run: node scripts/run-model-review-tests.mjs --suite credentials --phase test
      - name: Compile ACP runtime probe tests
        timeout-minutes: 20
        run: node scripts/run-model-review-tests.mjs --suite probe --phase compile
      - name: Test ACP runtime probe isolation
        timeout-minutes: 5
        run: node scripts/run-model-review-tests.mjs --suite probe --phase test
      - name: Compile runtime review tests
        timeout-minutes: 30
        run: node scripts/run-model-review-tests.mjs --suite runtime --phase compile
      - name: Test review ownership and cancellation
        timeout-minutes: 5
        run: node scripts/run-model-review-tests.mjs --suite runtime --phase test
      - name: Compile disconnected backend tests
        timeout-minutes: 10
        run: node scripts/run-model-review-tests.mjs --suite backend --phase compile
      - name: Test disconnected backend
        timeout-minutes: 5
        run: node scripts/run-model-review-tests.mjs --suite backend --phase test
      - name: Compile desktop review tests
        timeout-minutes: 30
        run: node scripts/run-model-review-tests.mjs --suite desktop --phase compile
      - name: Test desktop review state
        timeout-minutes: 5
        run: node scripts/run-model-review-tests.mjs --suite desktop --phase test
      - name: Build desktop and terminal client
        timeout-minutes: 45
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/preview
        run: |
          cargo build -p vibex-desktop -p vibex-client --locked --jobs 2
          if ($LASTEXITCODE -ne 0) { throw 'Development build failed' }
      - name: Package and probe portable executables
        run: |
          node scripts/package-development-windows.mjs --binary-dir target/preview/debug --output target/development-artifact
          if ($LASTEXITCODE -ne 0) { throw 'Portable package validation failed' }
      # Deliberately upload an allowlisted payload, never target/ or a Cargo cache.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibex-development-windows-x64
          path: target/development-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
